[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs_webui"
version = "0.7.4"
description = "RCS web interface for data collection and evaluation"
readme = "README.md"
license = "AGPL-3.0-or-later"
# only uses what rcs-core already depends on (standard library http server, pyarrow, simplejpeg, typer)
dependencies = ["rcs-core>=0.7.4"]
maintainers = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
authors = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
requires-python = ">=3.11"

[project.optional-dependencies]
# client of the policy server used in eval mode
eval = ["vlagents"]

[project.scripts]
rcs-webui = "rcs_webui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rcs_webui = ["static/*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
