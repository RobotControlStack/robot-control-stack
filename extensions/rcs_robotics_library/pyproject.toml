[build-system]
requires = [
  "build",
  "wheel",
  "setuptools>=45",
  "scikit-build-core>=0.3.3",
  "pybind11",
  "cmake",
  "ninja",
  "rcs-core>=0.7.3",
]
build-backend = "scikit_build_core.build"

[project]
name = "rcs_robotics_library"
version = "0.7.3"
description = "RCS robotics library integration"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["rcs-core>=0.7.3"]
maintainers = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
authors = [
  { name = "Tobias Juelg", email = "tobias.juelg@utn.de" },
  { name = "Pierre Krack", email = "pierre.krack@utn.de" },
]
requires-python = ">=3.11"


[dependency-groups]
build_deps = [
  "pin==3.7.0",
  "cmeel-urdfdom<5",
  "cmeel-tinyxml2<11",
  "scikit-build-core>=0.3.3",
]

[tool.scikit-build]
build.verbose = true
build.targets = ["_core"]
logging.level = "INFO"
build-dir = "build"
wheel.packages = ["src/rcs_robotics_library"]
install.components = ["python_package"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux*"]
before-build = "pip install --upgrade pip && pip install --group {package}/pyproject.toml:build_deps cmake ninja && pip install --no-index --no-deps --find-links {project}/dist/core rcs-core"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
environment = { SKBUILD_BUILD_DIR = "/tmp/rcs-build/{wheel_tag}" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# mujoco/pin only publish manylinux_2_28 wheels
manylinux-x86_64-image = "manylinux_2_28"
before-all = "yum install -y epel-release && yum install -y libxslt-devel boost-devel xz-devel libxml2-devel eigen3-devel"
# auditwheel 6.1 matches --exclude on the exact soname, globs need 6.2
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude librcs.so --exclude libpinocchio_default.so.3.7.0 --exclude libpinocchio_parsers.so.3.7.0"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
