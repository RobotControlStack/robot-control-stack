[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs_realsense"
version = "0.7.3"
description = "RCS realsense module"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
  "rcs-core>=0.7.3",
  "pyrealsense2~=2.55.1",
  "pupil_apriltags",
  "diskcache",
]
maintainers = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
authors = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
requires-python = ">=3.11"

[project.entry-points."rcs.cameras"]
realsense = "rcs_realsense.creators:create_camera_set"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
