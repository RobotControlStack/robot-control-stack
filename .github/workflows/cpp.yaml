name: Cpp
on:
  workflow_call:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/**"
  push:
    branches:
      - master

jobs:
  build_clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt install $(cat debian_deps.txt)
      - name: Check clang format
        run: make cppcheckformat
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Clang build
        run: make clangcompile PYTHON_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}
      - name: Clang Tidy
        run: make cpplint

  build_gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt install $(cat debian_deps.txt)
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: GCC build
        run: make gcccompile PYTHON_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}
